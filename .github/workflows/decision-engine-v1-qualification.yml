name: Decision Engine V1 exact-head qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/decision-engine-evaluate.mjs'
      - 'tests/decisionMaterializer.test.mjs'
      - 'tests/decisionV1Qualification.integration.mjs'
      - 'tests/contractCToContractD.integration.mjs'
      - 'tests/contractCBasisCitation.integration.mjs'
      - '.github/workflows/decision-engine-v1-qualification.yml'
      - 'docs/DECISION_ENGINE_V1_CONVERGENCE.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT_C_RELEASE: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
  CONTRACT_C_TAG: contract-c-v1.0.0
  CONTRACT_C_TAG_OBJECT: 6bd135a948e407212b2e77ec18ac5c402f93565e
  CONTRACT_C_VALIDATOR_BLOB: 9c75ccfbf2223578a8d1a7bf0c39673b394fbea4
  CONTRACT_C_RC1_EVIDENCE: 0e0d14471b0ed24382794244468539a723b8b888
  CONTRACT_D_RELEASE: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
  CONTRACT_D_TAG: contract-d-v1.0.0
  CONTRACT_D_TAG_OBJECT: 6eadd688b482f3c9fce2ce5e7a2841089d852096
  CONTRACT_D_CORE_VALIDATOR_BLOB: 564dcde5677df5ac8f86f21dc0ffd1692f44c9f0
  CONTRACT_D_EFFECT_REGISTRY_BLOB: a40f4f4447470654bdc16d852f5927189ae30cc5

jobs:
  qualify-v1:
    name: Exact-head V1 qualification
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Checkout exact Contract C authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_C_RELEASE }}
          path: _contract_c
          fetch-depth: 0

      - name: Checkout exact Contract D authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_RELEASE }}
          path: _contract_d
          fetch-depth: 0

      - name: Checkout frozen real-CAL Contract C evidence
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: ${{ env.CONTRACT_C_RC1_EVIDENCE }}
          path: _contract_c_rc1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Contract D validator dependencies
        run: python -m pip install --disable-pip-version-check -e './_contract_d[dev]'

      - name: Verify immutable contract authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _contract_c rev-parse HEAD)" = "$CONTRACT_C_RELEASE"
          test "$(git -C _contract_c rev-parse "refs/tags/$CONTRACT_C_TAG")" = "$CONTRACT_C_TAG_OBJECT"
          test "$(git -C _contract_c rev-parse "$CONTRACT_C_TAG^{}")" = "$CONTRACT_C_RELEASE"
          test "$(git -C _contract_c hash-object validators/contract_c.py)" = "$CONTRACT_C_VALIDATOR_BLOB"

          test "$(git -C _contract_d rev-parse HEAD)" = "$CONTRACT_D_RELEASE"
          test "$(git -C _contract_d rev-parse "refs/tags/$CONTRACT_D_TAG")" = "$CONTRACT_D_TAG_OBJECT"
          test "$(git -C _contract_d rev-parse "$CONTRACT_D_TAG^{}")" = "$CONTRACT_D_RELEASE"
          test "$(git -C _contract_d hash-object validators/contract_d_core.py)" = "$CONTRACT_D_CORE_VALIDATOR_BLOB"
          test "$(git -C _contract_d hash-object schema/contract-d/1.0.0/effect-registry.json)" = "$CONTRACT_D_EFFECT_REGISTRY_BLOB"

      - name: Run binding-preserving materializer controls
        run: node --test tests/decisionMaterializer.test.mjs

      - name: Run exact Contract C supported-claim V1 qualification cohort
        env:
          APPARATUS_CONTRACT_C_DIR: ${{ github.workspace }}/_contract_c
          APPARATUS_CONTRACT_D_DIR: ${{ github.workspace }}/_contract_d
          CONTRACT_C_RC1_EVIDENCE_DIR: ${{ github.workspace }}/_contract_c_rc1/research/contract-c-gate-real-producer-rc1/frozen-evidence/real-cal-corpus
          DECISION_V1_QUALIFICATION_OUTPUT_DIR: ${{ github.workspace }}/build/decision-v1-qualification
          PYTHON: python
        run: node tests/decisionV1Qualification.integration.mjs

      - name: Rerun maintained Contract C to D conformance cohort
        env:
          APPARATUS_CONTRACT_C_DIR: ${{ github.workspace }}/_contract_c
          CONTRACT_C_RC1_EVIDENCE_DIR: ${{ github.workspace }}/_contract_c_rc1/research/contract-c-gate-real-producer-rc1/frozen-evidence/real-cal-corpus
          CONTRACT_C_TO_D_OUTPUT_DIR: ${{ github.workspace }}/build/contract-c-to-d
          PYTHON: python
        run: node tests/contractCToContractD.integration.mjs

      - name: Rerun maintained causal-basis policy cohort
        env:
          APPARATUS_CONTRACT_C_DIR: ${{ github.workspace }}/_contract_c
          CONTRACT_C_BASIS_CITATION_OUTPUT_DIR: ${{ github.workspace }}/build/contract-c-basis-citation
          PYTHON: python
        run: node tests/contractCBasisCitation.integration.mjs

      - name: Verify exact Contract D semantics and non-authorization boundary
        env:
          PYTHONPATH: ${{ github.workspace }}/_contract_d
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          from validators.contract_d_consume import ApplicabilityExpectation, consume
          from validators.contract_d_core import canonical_json_bytes, semantic_identity, validate_decision

          root = Path('build/decision-v1-qualification')
          decisions = {
              p.stem: json.loads(p.read_text())
              for p in root.glob('*.json')
              if p.name != 'receipt.json'
          }
          assert set(decisions) == {'clear', 'contradicted', 'notCheckable', 'mixedContributions', 'failed'}

          for decision in decisions.values():
              validate_decision(decision)
              canonical_json_bytes(decision)

          clear = decisions['clear']
          expected = ApplicabilityExpectation(
              copy.deepcopy(clear['input_authority']),
              copy.deepcopy(clear['policy']),
              copy.deepcopy(clear['target']),
              'knowledge.add_verified_tag',
              {'scope': 'claim'},
          )

          assert consume(clear, expected)['outcome'] == 'candidate_for_authorization'
          assert consume(decisions['contradicted'], ApplicabilityExpectation(
              copy.deepcopy(decisions['contradicted']['input_authority']),
              copy.deepcopy(decisions['contradicted']['policy']),
              copy.deepcopy(decisions['contradicted']['target']),
              'knowledge.add_verified_tag',
              {'scope': 'claim'},
          ))['outcome'] == 'hold'
          assert consume(decisions['notCheckable'], ApplicabilityExpectation(
              copy.deepcopy(decisions['notCheckable']['input_authority']),
              copy.deepcopy(decisions['notCheckable']['policy']),
              copy.deepcopy(decisions['notCheckable']['target']),
              'knowledge.add_verified_tag',
              {'scope': 'claim'},
          ))['outcome'] == 'hold'
          assert consume(decisions['mixedContributions'], ApplicabilityExpectation(
              copy.deepcopy(decisions['mixedContributions']['input_authority']),
              copy.deepcopy(decisions['mixedContributions']['policy']),
              copy.deepcopy(decisions['mixedContributions']['target']),
              'knowledge.add_verified_tag',
              {'scope': 'claim'},
          ))['outcome'] == 'hold'
          assert consume(decisions['failed'], ApplicabilityExpectation(
              copy.deepcopy(decisions['failed']['input_authority']),
              copy.deepcopy(decisions['failed']['policy']),
              copy.deepcopy(decisions['failed']['target']),
              'knowledge.add_verified_tag',
              {'scope': 'claim'},
          ))['outcome'] == 'evaluation_failed'

          effect_tamper = copy.deepcopy(clear)
          effect_tamper['effect'] = {'type': 'knowledge.cite_as_evidence', 'version': '1'}
          validate_decision(effect_tamper)
          assert consume(effect_tamper, expected)['outcome'] == 'not_applicable'

          metadata_mutation = copy.deepcopy(clear)
          metadata_mutation['metadata'] = {'reason_codes': ['diagnostic-only-change'], 'diagnostics': {'x': 1}}
          validate_decision(metadata_mutation)
          assert semantic_identity(metadata_mutation) == semantic_identity(clear)

          assert 'effect' in decisions['contradicted']
          assert consume(decisions['contradicted'], ApplicabilityExpectation(
              copy.deepcopy(decisions['contradicted']['input_authority']),
              copy.deepcopy(decisions['contradicted']['policy']),
              copy.deepcopy(decisions['contradicted']['target']),
              'knowledge.add_verified_tag',
              {'scope': 'claim'},
          ))['outcome'] == 'hold'

          receipt_path = root / 'receipt.json'
          receipt = json.loads(receipt_path.read_text())
          receipt.update({
              'candidate_sha': __import__('os').environ['CANDIDATE_SHA'],
              'exact_contract_d_validation': True,
              'clear_only_candidate_for_authorization': True,
              'hold_effect_not_executable': True,
              'failed_consumer_outcome': 'evaluation_failed',
              'effect_tamper_not_applicable': True,
              'metadata_semantic_identity_invariant': True,
              'authorization_performed': False,
              'execution_performed': False,
          })
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Verify exact branch head remained unchanged during qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Upload V1 qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: decision-engine-v1-qualification-${{ env.CANDIDATE_SHA }}
          path: |
            build/decision-v1-qualification/
            build/contract-c-to-d/
            build/contract-c-basis-citation/
          if-no-files-found: error
          retention-days: 90
