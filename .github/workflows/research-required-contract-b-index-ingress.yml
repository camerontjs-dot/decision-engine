name: Research - Required Contract B index ingress

on:
  push:
    branches:
      - research/required-contract-b-index-ingress-20260908
  pull_request:
    branches: [main]
    paths:
      - 'research/required-contract-b-index-ingress/**'
      - '.github/workflows/research-required-contract-b-index-ingress.yml'

permissions:
  contents: read

env:
  DECISION_BASE: a4425f8eb47449ff6c683222921bbea9483742e2
  CONTRACT_C_RELEASE: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
  CONTRACT_D_RELEASE: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b

jobs:
  required-index-ingress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout exact Contract C release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_C_RELEASE }}
          path: _contract_c
          fetch-depth: 0

      - name: Checkout exact Contract D release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_RELEASE }}
          path: _contract_d
          fetch-depth: 0

      - name: Install released validator dependencies
        run: python -m pip install --disable-pip-version-check 'pydantic>=2.6,<3' 'rfc8785==0.1.4'

      - name: Verify exact authority identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _contract_c rev-parse HEAD)" = "$CONTRACT_C_RELEASE"
          test "$(git -C _contract_c rev-parse refs/tags/contract-c-v1.0.0)" = "6bd135a948e407212b2e77ec18ac5c402f93565e"
          test "$(git -C _contract_c hash-object validators/contract_c.py)" = "9c75ccfbf2223578a8d1a7bf0c39673b394fbea4"
          test "$(git -C _contract_d rev-parse HEAD)" = "$CONTRACT_D_RELEASE"
          test "$(git -C _contract_d rev-parse refs/tags/contract-d-v1.0.0)" = "6eadd688b482f3c9fce2ce5e7a2841089d852096"

      - name: Run required-index ingress pressure prototype
        env:
          PYTHON: python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/required-contract-b-index-ingress
          node research/required-contract-b-index-ingress/run.mjs \
            --contract-c-authority "$GITHUB_WORKSPACE/_contract_c" \
            --contract-d-authority "$GITHUB_WORKSPACE/_contract_d" \
            --fixture research/required-contract-b-index-ingress/real-cal-supported-child-1.contract-c.json \
            --contract-b-index research/required-contract-b-index-ingress/real-contract-b-index.json \
            | tee build/required-contract-b-index-ingress/RESULT.json

      - name: Assert research-only change surface
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "$DECISION_BASE"...HEAD -- src/ scripts/ | grep -q .; then
            echo 'prototype modified maintained source unexpectedly' >&2
            git diff --name-only "$DECISION_BASE"...HEAD -- src/ scripts/
            exit 1
          fi

      - name: Upload research receipt
        uses: actions/upload-artifact@v4
        with:
          name: required-contract-b-index-ingress-${{ github.run_id }}
          path: build/required-contract-b-index-ingress
          retention-days: 90
