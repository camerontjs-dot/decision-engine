name: Fresh Contract B and vertical slice v1

on:
  push:
    branches:
      - research/fresh-b-and-vertical-slice-v1
  pull_request:
    branches: [main]
    paths:
      - 'research/fresh-b-and-vertical-slice-v1/**'
      - '.github/workflows/fresh-b-and-vertical-slice-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DECISION_ENGINE_BASE: 9f5ffc04a0184abe44dc49509058a7ff88893e30
  CAL_PRODUCER_COMMIT: 53f0885b111676794d1bd20e10b91aa58b07e9d4
  EVIDENCE_BUNDLER_COMMIT: 6011789957f3294f97bff260069cfb5bb1c5772f
  CONTRACT_B_AUTHORITY: 6a45ab2de09370f3048ffb083e25b487f81117e4
  MINIMAL_LEGACY_A_TREE: 8a5c5e7e86d174c92c0e10b82ffc1bffa124a203
  NONEMPTY_LEGACY_A_TREE: c84878bc1199e96128837e964f69d6d5edf9bdd0
  CONTRACT_C_RELEASE: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
  CONTRACT_C_TAG: contract-c-v1.0.0
  CONTRACT_C_TAG_OBJECT: 6bd135a948e407212b2e77ec18ac5c402f93565e
  CONTRACT_C_VALIDATOR_BLOB: 9c75ccfbf2223578a8d1a7bf0c39673b394fbea4
  CONTRACT_D_RELEASE: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
  CONTRACT_D_TAG: contract-d-v1.0.0
  CONTRACT_D_TAG_OBJECT: 6eadd688b482f3c9fce2ce5e7a2841089d852096

jobs:
  cross-repository-slice:
    name: Fresh B then bounded vertical slices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Decision Engine research aperture
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact current CAL producer
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: ${{ env.CAL_PRODUCER_COMMIT }}
          path: _external/cal

      - name: Checkout exact current Evidence Bundler
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: ${{ env.EVIDENCE_BUNDLER_COMMIT }}
          path: _external/eb

      - name: Checkout current Contract B authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_B_AUTHORITY }}
          path: _external/apparatus-b

      - name: Checkout immutable Contract C release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_C_RELEASE }}
          path: _external/apparatus-c
          fetch-depth: 0

      - name: Checkout immutable Contract D release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_RELEASE }}
          path: _external/apparatus-d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable identities and research-only mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$DECISION_ENGINE_BASE")" = "$DECISION_ENGINE_BASE"
          test "$(git -C _external/cal rev-parse HEAD)" = "$CAL_PRODUCER_COMMIT"
          test "$(git -C _external/eb rev-parse HEAD)" = "$EVIDENCE_BUNDLER_COMMIT"
          test "$(git -C _external/apparatus-b rev-parse HEAD)" = "$CONTRACT_B_AUTHORITY"
          test "$(git -C _external/eb rev-parse HEAD:tests/fixtures/scaffold-run-minimal)" = "$MINIMAL_LEGACY_A_TREE"
          test "$(git -C _external/eb rev-parse HEAD:examples/handoff-demo/scaffold-run-bm25-handoff-demo)" = "$NONEMPTY_LEGACY_A_TREE"

          test "$(git -C _external/apparatus-c rev-parse HEAD)" = "$CONTRACT_C_RELEASE"
          test "$(git -C _external/apparatus-c rev-parse "refs/tags/$CONTRACT_C_TAG")" = "$CONTRACT_C_TAG_OBJECT"
          test "$(git -C _external/apparatus-c rev-parse "$CONTRACT_C_TAG^{}")" = "$CONTRACT_C_RELEASE"
          test "$(git -C _external/apparatus-c hash-object validators/contract_c.py)" = "$CONTRACT_C_VALIDATOR_BLOB"

          test "$(git -C _external/apparatus-d rev-parse HEAD)" = "$CONTRACT_D_RELEASE"
          test "$(git -C _external/apparatus-d rev-parse "refs/tags/$CONTRACT_D_TAG")" = "$CONTRACT_D_TAG_OBJECT"
          test "$(git -C _external/apparatus-d rev-parse "$CONTRACT_D_TAG^{}")" = "$CONTRACT_D_RELEASE"

          git diff --exit-code "$DECISION_ENGINE_BASE" -- src/contractCDecision.js src/contractD.js
          unexpected="$({ git diff --name-only "$DECISION_ENGINE_BASE"...HEAD || true; } | grep -Ev '^(research/fresh-b-and-vertical-slice-v1/|\.github/workflows/fresh-b-and-vertical-slice-v1\.yml$)' || true)"
          test -z "$unexpected" || { echo "unexpected research mutation:" >&2; echo "$unexpected" >&2; exit 1; }

      - name: Install bounded BM25/CAL/validator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'click>=8.1,<9' 'pdfminer.six>=20231228,<20270000' 'pydantic>=2.6,<3' \
            'pypdf>=4.0,<7' 'PyYAML>=6.0,<7' 'rank-bm25>=0.2.2,<0.3' \
            'typer>=0.12' 'rfc8785==0.1.4'
          python -m pip install --disable-pip-version-check --no-deps \
            -e ./_external/eb -e ./_external/cal -e ./_external/apparatus-d

      # ------------------------------------------------------------------
      # Unit 2: fresh valid B -> current CAL -> canonical C -> production D
      # ------------------------------------------------------------------
      - name: Unit 2 - prepare fresh Contract B and current CAL Contract C
        shell: bash
        run: |
          set -euo pipefail
          python research/fresh-b-and-vertical-slice-v1/prepare_cases.py \
            unit2 _external/eb build/fresh-b-slice

      - name: Unit 2 - validate Contract B against current canonical authority
        env:
          PYTHONPATH: ${{ github.workspace }}/_external/apparatus-b
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from validators.verify_contract_integrity import verify

          bundle = Path('build/fresh-b-slice/unit2/contract-b')
          report = verify(bundle, against_pin='1.2.0')
          receipt = {'passed': report.passed, 'errors': report.errors, 'checked_files': report.checked_files}
          Path('build/fresh-b-slice/unit2/apparatus-b-verifier.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          assert report.passed, report.errors
          PY

      - name: Unit 2 - validate Contract C against exact release authority
        shell: bash
        run: |
          set -euo pipefail
          raw_sha="$(sha256sum build/fresh-b-slice/unit2/contract-c.json | awk '{print $1}')"
          python _external/apparatus-c/validators/contract_c.py \
            build/fresh-b-slice/unit2/contract-c.json \
            --expected-sha256 "$raw_sha" \
            --contract-b-index build/fresh-b-slice/unit2/contract-b-index.json

      - name: Unit 2 - invoke unchanged Decision Engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fresh-b-slice/unit2/decisions
          csha="$(cat build/fresh-b-slice/unit2/contract-c.sha256)"
          for context in build/fresh-b-slice/unit2/contexts/*.json; do
            proposition="$(basename "$context" .json)"
            node research/fresh-b-and-vertical-slice-v1/invoke.mjs \
              --contract-c build/fresh-b-slice/unit2/contract-c.json \
              --expected-contract-c-sha256 "$csha" \
              --contract-c-authority-root _external/apparatus-c \
              --expected-contract-b build/fresh-b-slice/unit2/expected-contract-b.json \
              --decision-context "$context" \
              --python python \
              --output "build/fresh-b-slice/unit2/decisions/$proposition.json"
          done

      - name: Unit 2 - validate and consume canonical Contract D
        env:
          PYTHONPATH: ${{ github.workspace }}/_external/apparatus-d
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from validators.contract_d_consume import ApplicabilityExpectation, consume
          from validators.contract_d_core import canonical_json_bytes, validate_decision

          case = Path('build/fresh-b-slice/unit2')
          c_sha = 'sha256:' + hashlib.sha256((case / 'contract-c.json').read_bytes()).hexdigest()
          outcomes = {}
          for decision_path in sorted((case / 'decisions').glob('*.json')):
              pid = decision_path.stem
              decision = json.loads(decision_path.read_text())
              context = json.loads((case / 'contexts' / f'{pid}.json').read_text())
              validate_decision(decision)
              canonical_json_bytes(decision)
              assert decision['input_authority']['immutable_id'] == c_sha
              assert decision['target'] == context['target']
              assert decision['policy'] == context['policy']
              assert decision['effect'] == {
                  'type': 'knowledge.add_verified_tag', 'version': '1', 'params': {'scope': 'claim'}
              }
              expectation = ApplicabilityExpectation(
                  decision['input_authority'], decision['policy'], decision['target'],
                  'knowledge.add_verified_tag', {'scope': 'claim'}
              )
              consumed = consume(decision, expectation)
              assert 'authorization' not in json.dumps(decision).lower()
              outcomes[pid] = {
                  'evaluation': decision['evaluation'],
                  'canonical_consumer_outcome': consumed['outcome'],
              }
          (case / 'decision-outcomes.json').write_text(json.dumps(outcomes, indent=2, sort_keys=True) + '\n')
          PY

      - name: Unit 2 - wrong Contract B binding still fails closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/fresh-b-slice/unit2')
          wrong = json.loads((root / 'expected-contract-b.json').read_text())
          wrong['bundle_id'] += '-substituted'
          (root / 'wrong-contract-b.json').write_text(json.dumps(wrong) + '\n')
          PY
          context="$(find build/fresh-b-slice/unit2/contexts -name '*.json' | sort | head -n1)"
          csha="$(cat build/fresh-b-slice/unit2/contract-c.sha256)"
          set +e
          node research/fresh-b-and-vertical-slice-v1/invoke.mjs \
            --contract-c build/fresh-b-slice/unit2/contract-c.json \
            --expected-contract-c-sha256 "$csha" \
            --contract-c-authority-root _external/apparatus-c \
            --expected-contract-b build/fresh-b-slice/unit2/wrong-contract-b.json \
            --decision-context "$context" --python python \
            --output build/fresh-b-slice/unit2/should-not-exist.json \
            2> build/fresh-b-slice/unit2/wrong-b.stderr
          status=$?
          set -e
          test "$status" -ne 0
          grep -q '"code":"contract_b_binding_mismatch"' build/fresh-b-slice/unit2/wrong-b.stderr
          test ! -e build/fresh-b-slice/unit2/should-not-exist.json

      # ------------------------------------------------------------------
      # Vertical diagnostic: preserve the default-BM25 empty-evidence defect.
      # ------------------------------------------------------------------
      - name: Vertical diagnostic - reproduce empty-evidence handoff
        shell: bash
        run: |
          set -euo pipefail
          python research/fresh-b-and-vertical-slice-v1/prepare_cases.py \
            vertical-diagnostic _external/eb build/fresh-b-slice

      - name: Vertical diagnostic - classify producer and validator hole
        env:
          PYTHONPATH: ${{ github.workspace }}/_external/apparatus-b
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from validators.verify_contract_integrity import verify

          case = Path('build/fresh-b-slice/vertical-diagnostic')
          summary = json.loads((case / 'diagnostic-summary.json').read_text())
          assert summary['retrieval_no_candidate_claim_ids'], summary
          assert summary['synthetic_review']['annotation_count'] == 0, summary
          assert summary['final_evidence_directory_exists'] is False, summary
          assert summary['final_total_evidence_passages'] == 0, summary
          assert summary['final_quality_gates']['every_claim_has_at_least_one_passage'] is False, summary
          assert summary['evidence_bundler_validation_errors'] == [], summary
          assert summary['cal_intake']['accepted'] is False, summary
          assert summary['cal_intake']['message'] == 'evidence/ directory missing', summary

          report = verify(case / 'contract-b', against_pin='1.2.0')
          receipt = {'passed': report.passed, 'errors': report.errors, 'checked_files': report.checked_files}
          (case / 'apparatus-b-verifier.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          assert not report.passed, 'canonical verifier unexpectedly accepted empty-evidence B'
          assert 'evidence/ directory missing' in report.errors, report.errors
          PY

      # ------------------------------------------------------------------
      # Non-empty vertical slice: same actual path, known candidate-producing
      # maintained demo, then CAL -> C -> production Decision -> D.
      # ------------------------------------------------------------------
      - name: Vertical non-empty - retrieval review finalization and current CAL
        shell: bash
        run: |
          set -euo pipefail
          python research/fresh-b-and-vertical-slice-v1/prepare_cases.py \
            vertical-nonempty _external/eb build/fresh-b-slice

      - name: Vertical non-empty - validate finalized Contract B canonically
        env:
          PYTHONPATH: ${{ github.workspace }}/_external/apparatus-b
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from validators.verify_contract_integrity import verify
          case = Path('build/fresh-b-slice/vertical-nonempty')
          summary = json.loads((case / 'prepared-summary.json').read_text())
          assert summary['final_evidence_directory_exists'] is True, summary
          assert summary['final_total_evidence_passages'] > 0, summary
          assert summary['final_quality_gates']['every_claim_has_at_least_one_passage'] is True, summary
          assert summary['evidence_bundler_validation_errors'] == [], summary
          report = verify(case / 'contract-b', against_pin='1.2.0')
          receipt = {'passed': report.passed, 'errors': report.errors, 'checked_files': report.checked_files}
          (case / 'apparatus-b-verifier.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          assert report.passed, report.errors
          PY

      - name: Vertical non-empty - validate Contract C against exact release authority
        shell: bash
        run: |
          set -euo pipefail
          raw_sha="$(sha256sum build/fresh-b-slice/vertical-nonempty/contract-c.json | awk '{print $1}')"
          python _external/apparatus-c/validators/contract_c.py \
            build/fresh-b-slice/vertical-nonempty/contract-c.json \
            --expected-sha256 "$raw_sha" \
            --contract-b-index build/fresh-b-slice/vertical-nonempty/contract-b-index.json

      - name: Vertical non-empty - invoke unchanged Decision Engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fresh-b-slice/vertical-nonempty/decisions
          csha="$(cat build/fresh-b-slice/vertical-nonempty/contract-c.sha256)"
          for context in build/fresh-b-slice/vertical-nonempty/contexts/*.json; do
            proposition="$(basename "$context" .json)"
            node research/fresh-b-and-vertical-slice-v1/invoke.mjs \
              --contract-c build/fresh-b-slice/vertical-nonempty/contract-c.json \
              --expected-contract-c-sha256 "$csha" \
              --contract-c-authority-root _external/apparatus-c \
              --expected-contract-b build/fresh-b-slice/vertical-nonempty/expected-contract-b.json \
              --decision-context "$context" --python python \
              --output "build/fresh-b-slice/vertical-nonempty/decisions/$proposition.json"
          done

      - name: Vertical non-empty - validate and consume canonical Contract D
        env:
          PYTHONPATH: ${{ github.workspace }}/_external/apparatus-d
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from validators.contract_d_consume import ApplicabilityExpectation, consume
          from validators.contract_d_core import canonical_json_bytes, validate_decision

          case = Path('build/fresh-b-slice/vertical-nonempty')
          c_sha = 'sha256:' + hashlib.sha256((case / 'contract-c.json').read_bytes()).hexdigest()
          outcomes = {}
          for decision_path in sorted((case / 'decisions').glob('*.json')):
              pid = decision_path.stem
              decision = json.loads(decision_path.read_text())
              context = json.loads((case / 'contexts' / f'{pid}.json').read_text())
              validate_decision(decision)
              canonical_json_bytes(decision)
              assert decision['input_authority']['immutable_id'] == c_sha
              assert decision['target'] == context['target']
              assert decision['policy'] == context['policy']
              expectation = ApplicabilityExpectation(
                  decision['input_authority'], decision['policy'], decision['target'],
                  'knowledge.add_verified_tag', {'scope': 'claim'}
              )
              consumed = consume(decision, expectation)
              assert 'authorization' not in json.dumps(decision).lower()
              outcomes[pid] = {
                  'evaluation': decision['evaluation'],
                  'canonical_consumer_outcome': consumed['outcome'],
              }
          (case / 'decision-outcomes.json').write_text(json.dumps(outcomes, indent=2, sort_keys=True) + '\n')
          PY

      - name: Assemble terminal run receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          root = Path('build/fresh-b-slice')
          unit2 = json.loads((root / 'unit2/prepared-summary.json').read_text())
          unit2_d = json.loads((root / 'unit2/decision-outcomes.json').read_text())
          diagnostic = json.loads((root / 'vertical-diagnostic/diagnostic-summary.json').read_text())
          nonempty = json.loads((root / 'vertical-nonempty/prepared-summary.json').read_text())
          nonempty_d = json.loads((root / 'vertical-nonempty/decision-outcomes.json').read_text())
          receipt = {
              'status': 'PASS_WITH_PRESERVED_VERTICAL_FALSIFIER',
              'run_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'decision_engine_base': '9f5ffc04a0184abe44dc49509058a7ff88893e30',
              'cal_producer_commit': '53f0885b111676794d1bd20e10b91aa58b07e9d4',
              'evidence_bundler_commit': '6011789957f3294f97bff260069cfb5bb1c5772f',
              'contract_b_authority': '6a45ab2de09370f3048ffb083e25b487f81117e4',
              'contract_c_release': '5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1',
              'contract_d_release': '298a1a0f7b7b6d7712e11200d04faec3e1ca169b',
              'unit2': unit2,
              'unit2_decisions': unit2_d,
              'vertical_default_bm25_falsifier': diagnostic,
              'vertical_nonempty': nonempty,
              'vertical_nonempty_decisions': nonempty_d,
              'contract_a_posture': 'maintained legacy authority; not modernization promotion evidence',
              'current_cal_posture': 'producer under test; observed C shape is not asserted as final CAL semantics',
              'synthetic_review_truth_claim': False,
              'decision_semantics_modified': False,
              'authorization_or_execution_performed': False,
          }
          (root / 'run-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload frozen experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-b-and-vertical-slice-v1
          path: build/fresh-b-slice
          if-no-files-found: error
          retention-days: 90
