name: Research - Projection kernel mutation audit R2

on:
  push:
    branches:
      - research/projection-kernel-mutation-audit-20260910-r2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-audit-r2:
    runs-on: ubuntu-24.04
    env:
      SUBJECT_RECORD_HEAD: 00251c6d01a45f6cb14fc3d8ac4c7a4fb566f57c
      SUBJECT_KERNEL_SHA: e12d53020b3a6a046f4ee7688db0a5ea5c5e0a63e758b1c1e5711e7b227759e3
      CONTRACT_D_RELEASE: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
      CONTRACT_D_TAG: contract-d-v1.0.0
      CONTRACT_D_TAG_OBJECT: 6eadd688b482f3c9fce2ce5e7a2841089d852096
    steps:
      - name: Checkout corrected mutation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Contract D authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_RELEASE }}
          path: .contract-d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Contract D validator dependencies
        run: python -m pip install --disable-pip-version-check -e './.contract-d[dev]'

      - name: Verify exact subject and authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SUBJECT_RECORD_HEAD" HEAD
          test "$(git -C .contract-d rev-parse HEAD)" = "$CONTRACT_D_RELEASE"
          test "$(git -C .contract-d rev-parse "refs/tags/$CONTRACT_D_TAG")" = "$CONTRACT_D_TAG_OBJECT"
          test "$(git -C .contract-d rev-parse "$CONTRACT_D_TAG^{}")" = "$CONTRACT_D_RELEASE"
          test "$(sha256sum research/contract-c-adapter-projection-kernel/projectionKernel.mjs | cut -d' ' -f1)" = "$SUBJECT_KERNEL_SHA"

      - name: Execute corrected mutation audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .projection-mutation-output-r2
          mkdir -p .projection-mutation-output-r2
          node research/projection-kernel-mutation-audit/run-r2.mjs \
            --contract-d-root "$PWD/.contract-d" \
            --out "$PWD/.projection-mutation-output-r2" | tee .projection-mutation-output-r2/console.log

      - name: Verify research-only surface
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$SUBJECT_RECORD_HEAD"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src|scripts|tests)/'; then
            echo 'Mutation audit changed maintained Decision paths' >&2
            exit 1
          fi

      - name: Package corrected evidence
        shell: bash
        run: |
          set -euo pipefail
          tar -czf projection-kernel-mutation-audit-r2-evidence.tgz \
            .projection-mutation-output-r2 \
            research/projection-kernel-mutation-audit
          sha256sum projection-kernel-mutation-audit-r2-evidence.tgz | tee .projection-mutation-output-r2/evidence-tgz.sha256

      - name: Upload corrected evidence
        uses: actions/upload-artifact@v4
        with:
          name: projection-kernel-mutation-audit-r2-${{ github.run_id }}
          path: |
            .projection-mutation-output-r2/
            projection-kernel-mutation-audit-r2-evidence.tgz
          if-no-files-found: error
          retention-days: 90
