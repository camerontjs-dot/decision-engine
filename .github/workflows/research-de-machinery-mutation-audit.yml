name: Research - Decision machinery mutation audit

on:
  push:
    branches:
      - research/de-machinery-mutation-audit-20260908
  pull_request:
    branches: [main]
    paths:
      - 'research/de-machinery-mutation-audit/**'
      - '.github/workflows/research-de-machinery-mutation-audit.yml'

permissions:
  contents: read

env:
  DECISION_BASE: a4425f8eb47449ff6c683222921bbea9483742e2
  CONTRACT_C_RELEASE: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
  CONTRACT_D_RELEASE: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
  CONTRACT_C_RC1_EVIDENCE: 0e0d14471b0ed24382794244468539a723b8b888

jobs:
  machinery-mutation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout exact Contract C authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_C_RELEASE }}
          path: _contract_c
          fetch-depth: 0

      - name: Checkout exact Contract D authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_RELEASE }}
          path: _contract_d
          fetch-depth: 0

      - name: Checkout frozen real-CAL specimen evidence
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: ${{ env.CONTRACT_C_RC1_EVIDENCE }}
          path: _contract_c_rc1

      - name: Install released validator dependencies
        run: python -m pip install --disable-pip-version-check -e './_contract_d[dev]'

      - name: Verify exact frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _contract_c rev-parse HEAD)" = "$CONTRACT_C_RELEASE"
          test "$(git -C _contract_c rev-parse refs/tags/contract-c-v1.0.0)" = "6bd135a948e407212b2e77ec18ac5c402f93565e"
          test "$(git -C _contract_c hash-object validators/contract_c.py)" = "9c75ccfbf2223578a8d1a7bf0c39673b394fbea4"
          test "$(git -C _contract_d rev-parse HEAD)" = "$CONTRACT_D_RELEASE"
          test "$(git -C _contract_d rev-parse refs/tags/contract-d-v1.0.0)" = "6eadd688b482f3c9fce2ce5e7a2841089d852096"

      - name: Construct non-authoritative lookalike Contract C root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _fake_contract_c
          mkdir _fake_contract_c
          cp -R _contract_c/validators _fake_contract_c/validators
          cp -R _contract_c/fixtures _fake_contract_c/fixtures
          test ! -d _fake_contract_c/.git

      - name: Run mutation audit over maintained Decision machinery
        env:
          APPARATUS_CONTRACT_C_DIR: ${{ github.workspace }}/_contract_c
          APPARATUS_CONTRACT_D_DIR: ${{ github.workspace }}/_contract_d
          CONTRACT_C_RC1_EVIDENCE_DIR: ${{ github.workspace }}/_contract_c_rc1/research/contract-c-gate-real-producer-rc1/frozen-evidence/real-cal-corpus
          FAKE_CONTRACT_C_DIR: ${{ github.workspace }}/_fake_contract_c
          PYTHON: python
        run: python research/de-machinery-mutation-audit/run-mutation-audit.py

      - name: Assert branch did not mutate maintained source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$DECISION_BASE" -- src scripts

      - name: Upload mutation receipt
        uses: actions/upload-artifact@v4
        with:
          name: de-machinery-mutation-audit-${{ github.run_id }}
          path: build/de-machinery-mutation-audit/RESULT.json
          retention-days: 90
