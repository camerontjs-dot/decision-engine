name: Research - Agent-result assessment-authority kernel

on:
  push:
    branches:
      - research/agent-result-assessment-authority-kernel-20260909
  pull_request:
    paths:
      - 'research/agent-result-assessment-authority-kernel/**'
      - '.github/workflows/research-agent-result-assessment-authority-kernel.yml'

permissions:
  contents: read

jobs:
  second-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Contract D release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: .research-contract-d
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Contract D validator dependency
        run: python -m pip install 'rfc8785==0.1.4'

      - name: Verify dependency and exact Contract D authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a6328085fc3e634e57133c5e6c5fe4d345fb4d82 HEAD
          test "$(git -C .research-contract-d rev-parse HEAD)" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"
          test "$(git -C .research-contract-d rev-parse refs/tags/contract-d-v1.0.0)" = "6eadd688b482f3c9fce2ce5e7a2841089d852096"
          test "$(git -C .research-contract-d rev-parse 'refs/tags/contract-d-v1.0.0^{}')" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"

      - name: Execute second-domain pressure test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent-result-output
          mkdir -p .agent-result-output
          node research/agent-result-assessment-authority-kernel/run.mjs \
            --evidence research/agent-result-assessment-authority-kernel/evidence.json \
            --contract-d-root .research-contract-d \
            --out .agent-result-output | tee .agent-result-output/console.log

      - name: Assert exact reused kernel and no maintained source mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum research/release-qualification-assessment-authority-kernel/kernel.mjs | awk '{print $1}')" = "a8bbc96c2c01e4e6ca3bb66f4ce7e4d89b3d0be4098d65cdf71c5b60bf200abb"
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src|scripts|tests)/'; then
            echo 'Second-domain research modified maintained Decision paths' >&2
            exit 1
          fi

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          tar -czf agent-result-assessment-authority-kernel-evidence.tgz \
            .agent-result-output \
            research/agent-result-assessment-authority-kernel/README.md \
            research/agent-result-assessment-authority-kernel/evidence.json \
            research/agent-result-assessment-authority-kernel/producer.mjs \
            research/agent-result-assessment-authority-kernel/policies.mjs \
            research/agent-result-assessment-authority-kernel/run.mjs \
            research/release-qualification-assessment-authority-kernel/kernel.mjs
          sha256sum agent-result-assessment-authority-kernel-evidence.tgz | tee .agent-result-output/evidence-tgz.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-result-assessment-authority-kernel-${{ github.run_id }}
          path: |
            .agent-result-output/
            agent-result-assessment-authority-kernel-evidence.tgz
          if-no-files-found: error
