name: Research - Contract D Schema Bake-off RC0

on:
  push:
    branches:
      - research/contract-d-schema-bakeoff-rc0
  pull_request:
    paths:
      - "research/contract-d-schema-bakeoff-rc0/**"
      - ".github/workflows/research-contract-d-schema-bakeoff-rc0.yml"

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frozen RC0 bake-off
        run: node research/contract-d-schema-bakeoff-rc0/run.mjs
      - name: Run frozen RC1 evolution discriminator
        run: node research/contract-d-schema-bakeoff-rc0/run-rc1.mjs
      - name: Run frozen RC2 semantic-core discriminator
        run: node research/contract-d-schema-bakeoff-rc0/run-rc2.mjs
