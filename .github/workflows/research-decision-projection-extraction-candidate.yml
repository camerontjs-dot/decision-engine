name: Research - Decision projection extraction candidate

on:
  push:
    branches:
      - research/decision-projection-extraction-candidate-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extraction-candidate:
    runs-on: ubuntu-24.04
    env:
      BASE_RECORD_HEAD: d04147a5a6692be0d971991df28aaa155c5719dd
      LIVE_MAIN: 358c2bb20f490bf25e808434394b26a70a16a123
      SPECIMEN_COMMIT: 33f39e88f0f94a13afe740d087e4896247695f79
      CONTRACT_C_RELEASE: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
      CONTRACT_C_TAG: contract-c-v1.0.0
      CONTRACT_C_TAG_OBJECT: 6bd135a948e407212b2e77ec18ac5c402f93565e
      CONTRACT_D_RELEASE: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
      CONTRACT_D_TAG: contract-d-v1.0.0
      CONTRACT_D_TAG_OBJECT: 6eadd688b482f3c9fce2ce5e7a2841089d852096

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact source-bound specimen
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: ${{ env.SPECIMEN_COMMIT }}
          path: .specimen
          fetch-depth: 0

      - name: Checkout exact Contract C authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_C_RELEASE }}
          path: .contract-c
          fetch-depth: 0

      - name: Checkout exact Contract D authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_RELEASE }}
          path: .contract-d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Contract D validator dependencies
        run: python -m pip install --disable-pip-version-check -e './.contract-d[dev]'

      - name: Verify exact ancestry and authorities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_RECORD_HEAD" HEAD
          test "$(git rev-parse origin/main)" = "$LIVE_MAIN"
          test "$(git -C .specimen rev-parse HEAD)" = "$SPECIMEN_COMMIT"
          test "$(git -C .contract-c rev-parse HEAD)" = "$CONTRACT_C_RELEASE"
          test "$(git -C .contract-c rev-parse "refs/tags/$CONTRACT_C_TAG")" = "$CONTRACT_C_TAG_OBJECT"
          test "$(git -C .contract-c rev-parse "$CONTRACT_C_TAG^{}")" = "$CONTRACT_C_RELEASE"
          test "$(git -C .contract-d rev-parse HEAD)" = "$CONTRACT_D_RELEASE"
          test "$(git -C .contract-d rev-parse "refs/tags/$CONTRACT_D_TAG")" = "$CONTRACT_D_TAG_OBJECT"
          test "$(git -C .contract-d rev-parse "$CONTRACT_D_TAG^{}")" = "$CONTRACT_D_RELEASE"

      - name: Execute extraction candidate pressure test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .decision-projection-extraction-output
          mkdir -p .decision-projection-extraction-output
          node research/decision-projection-extraction-candidate/run.mjs \
            --contract-c-root "$PWD/.contract-c" \
            --contract-d-root "$PWD/.contract-d" \
            --specimen-root "$PWD/.specimen" \
            --out "$PWD/.decision-projection-extraction-output" | tee .decision-projection-extraction-output/console.log

      - name: Verify research-only mutation surface
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_RECORD_HEAD"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src|scripts|tests)/'; then
            echo 'Extraction candidate modified maintained Decision paths' >&2
            exit 1
          fi

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          tar -czf decision-projection-extraction-candidate-evidence.tgz \
            .decision-projection-extraction-output \
            research/decision-projection-extraction-candidate
          sha256sum decision-projection-extraction-candidate-evidence.tgz | tee .decision-projection-extraction-output/evidence-tgz.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: decision-projection-extraction-candidate-${{ github.run_id }}
          path: |
            .decision-projection-extraction-output/
            decision-projection-extraction-candidate-evidence.tgz
          if-no-files-found: error
          retention-days: 90
