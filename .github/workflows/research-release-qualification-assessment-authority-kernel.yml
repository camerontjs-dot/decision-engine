name: Research - Release qualification assessment-authority kernel

on:
  push:
    branches:
      - research/release-qualification-assessment-authority-kernel-20260909
  pull_request:
    paths:
      - 'research/release-qualification-assessment-authority-kernel/**'
      - '.github/workflows/research-release-qualification-assessment-authority-kernel.yml'

permissions:
  contents: read

jobs:
  assessment-authority-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Decision Engine research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Contract D release
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: .research-contract-d
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Contract D validator dependency
        run: python -m pip install 'rfc8785==0.1.4'

      - name: Verify exact Contract D checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .research-contract-d rev-parse HEAD)" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"
          test "$(git -C .research-contract-d rev-parse refs/tags/contract-d-v1.0.0)" = "6eadd688b482f3c9fce2ce5e7a2841089d852096"
          test "$(git -C .research-contract-d rev-parse 'refs/tags/contract-d-v1.0.0^{}')" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"

      - name: Execute bounded assessment-authority kernel experiment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .research-output
          mkdir -p .research-output
          node research/release-qualification-assessment-authority-kernel/run.mjs \
            --evidence research/release-qualification-assessment-authority-kernel/evidence.json \
            --contract-d-root .research-contract-d \
            --out .research-output | tee .research-output/console.log

      - name: Assert no maintained Decision source mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src|scripts|tests)/'; then
            echo 'Research branch modified a maintained Decision path' >&2
            exit 1
          fi

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          tar -czf release-qualification-assessment-authority-kernel-evidence.tgz \
            .research-output \
            research/release-qualification-assessment-authority-kernel/README.md \
            research/release-qualification-assessment-authority-kernel/THOUGHTS.md \
            research/release-qualification-assessment-authority-kernel/evidence.json \
            research/release-qualification-assessment-authority-kernel/canonical.mjs \
            research/release-qualification-assessment-authority-kernel/producer.mjs \
            research/release-qualification-assessment-authority-kernel/kernel.mjs \
            research/release-qualification-assessment-authority-kernel/releasePolicies.mjs \
            research/release-qualification-assessment-authority-kernel/run.mjs
          sha256sum release-qualification-assessment-authority-kernel-evidence.tgz | tee .research-output/evidence-tgz.sha256

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-assessment-authority-kernel-${{ github.run_id }}
          path: |
            .research-output/
            release-qualification-assessment-authority-kernel-evidence.tgz
          if-no-files-found: error
