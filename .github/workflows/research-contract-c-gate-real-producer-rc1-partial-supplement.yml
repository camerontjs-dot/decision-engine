name: Research - Contract C Gate RC1 partial-producer supplement

on:
  push:
    branches:
      - research-infra/contract-c-gate-real-producer-shadow-rc1
    paths:
      - "research/contract-c-gate-real-producer-rc1/collectPartialProducerSupplement.py"
      - "research/contract-c-gate-real-producer-rc1/runPartialProducerSupplement.mjs"
      - "research/contract-c-gate-real-producer-rc1/exactByteContractCGateAdapter.mjs"
      - "research/contract-c-gate-real-producer-rc1/BAR.json"
      - "research/contract-c-gate-real-producer-rc1/makeValidationReceipts.py"
      - ".github/workflows/research-contract-c-gate-real-producer-rc1-partial-supplement.yml"
  pull_request:
    paths:
      - "research/contract-c-gate-real-producer-rc1/collectPartialProducerSupplement.py"
      - "research/contract-c-gate-real-producer-rc1/runPartialProducerSupplement.mjs"
      - "research/contract-c-gate-real-producer-rc1/exactByteContractCGateAdapter.mjs"
      - "research/contract-c-gate-real-producer-rc1/BAR.json"
      - "research/contract-c-gate-real-producer-rc1/makeValidationReceipts.py"
      - ".github/workflows/research-contract-c-gate-real-producer-rc1-partial-supplement.yml"

permissions:
  contents: write

jobs:
  partial-producer-supplement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Decision Engine research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned Contract C authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 00bdf9546a877f9f6c1d7fd227fd959e1d7aa99e
          path: external/apparatus-contracts
          fetch-depth: 0

      - name: Check out pinned current CAL
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 53f0885b111676794d1bd20e10b91aa58b07e9d4
          path: external/claim-audit-lab
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Verify exact current CAL rule/exporter and Contract C authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/apparatus-contracts rev-parse HEAD)" = "00bdf9546a877f9f6c1d7fd227fd959e1d7aa99e"
          test "$(git -C external/apparatus-contracts hash-object validators/contract_c.py)" = "9c75ccfbf2223578a8d1a7bf0c39673b394fbea4"
          test "$(git -C external/claim-audit-lab rev-parse HEAD)" = "53f0885b111676794d1bd20e10b91aa58b07e9d4"
          test "$(git -C external/claim-audit-lab hash-object src/claim_audit_lab/rules.py)" = "4e2c7ebb1a7866d941fc2570757e64098359413a"
          test "$(git -C external/claim-audit-lab hash-object tests/test_rules.py)" = "ed42acb8c21843676028ccd8c2b9ecc776ad2154"
          test "$(git -C external/claim-audit-lab hash-object src/claim_audit_lab/contracts/contract_c.py)" = "d6b32a44ef11109fe0ee91efa212d3904badf58c"
          test "$(git -C external/claim-audit-lab hash-object tests/test_contract_c_exporter.py)" = "bb7f128bdc089c1635a6f487a0c6861920ec5c9f"

      - name: Install pinned authority and current CAL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e external/apparatus-contracts
          cd external/claim-audit-lab
          uv sync --extra dev

      - name: Reconfirm current CAL partial-support rule control
        shell: bash
        run: |
          set -euo pipefail
          cd external/claim-audit-lab
          uv run pytest -q tests/test_rules.py::test_numeric_mismatch_is_partially_supported_and_high_risk

      - name: Emit partial-support Contract C through current CAL exporter
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/artifacts/contract-c-gate-real-producer-rc1-partial-supplement"
          mkdir -p "$root/corpus"
          cd external/claim-audit-lab
          uv run python "$GITHUB_WORKSPACE/research/contract-c-gate-real-producer-rc1/collectPartialProducerSupplement.py" \
            "$GITHUB_WORKSPACE/external/claim-audit-lab" \
            "$root/corpus"

      - name: Independently validate exact Contract C bytes and Contract-B binding
        env:
          CONTRACT_C_AUTHORITY_ROOT: external/apparatus-contracts
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/contract-c-gate-real-producer-rc1-partial-supplement"
          python research/contract-c-gate-real-producer-rc1/makeValidationReceipts.py \
            "$root/corpus" \
            "$root/validation-receipts" \
            --index-dir "$root/corpus"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/contract-c-gate-real-producer-rc1-partial-supplement/validation-receipts/MANIFEST.json")
          manifest = json.loads(path.read_text())
          rows = manifest["rows"]
          if len(rows) != 1 or rows[0]["valid"] is not True:
              raise SystemExit(f"partial supplement failed authoritative validation: {rows}")
          PY

      - name: Evaluate preregistered Gate bar without widening consumption
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/contract-c-gate-real-producer-rc1-partial-supplement"
          node research/contract-c-gate-real-producer-rc1/runPartialProducerSupplement.mjs \
            "$root/corpus" \
            "$root/validation-receipts" \
            research/contract-c-gate-real-producer-rc1/BAR.json \
            | tee "$root/gate-shadow.json"

      - name: Hash supplemental evidence
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/contract-c-gate-real-producer-rc1-partial-supplement"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS"

      - name: Freeze first successful supplemental capture or verify bytes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          src="artifacts/contract-c-gate-real-producer-rc1-partial-supplement"
          dst="research/contract-c-gate-real-producer-rc1/supplement-partially-supported"
          if [ ! -f "$dst/CAPTURED.json" ]; then
            mkdir -p "$dst"
            cp -R "$src"/. "$dst"/
            cat > "$dst/CAPTURED.json" <<JSON
          {
            "source_commit": "${GITHUB_SHA}",
            "workflow": "research-contract-c-gate-real-producer-rc1-partial-supplement.yml",
            "status": "frozen_after_successful_assertion_run"
          }
          JSON
            diff -qr --exclude=CAPTURED.json "$src" "$dst"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$dst"
            git commit -m "research-infra: freeze RC1 partially-supported producer supplement"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            diff -qr --exclude=CAPTURED.json "$src" "$dst"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-c-gate-rc1-partial-supplement-${{ github.sha }}
          path: artifacts/contract-c-gate-real-producer-rc1-partial-supplement/
          if-no-files-found: warn
          retention-days: 90
