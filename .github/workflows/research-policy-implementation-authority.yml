name: Research - Policy implementation authority

on:
  push:
    branches:
      - research/policy-implementation-authority-20260910
  pull_request:
    branches:
      - research/artifact-manifest-authority-projection-20260910-r2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-implementation-boundary:
    runs-on: ubuntu-24.04
    env:
      BASE_RECORD_HEAD: 74d27fe3a217f57e31326a93ddc14ad37d9f6a11
      PROJECTION_KERNEL_SHA: e12d53020b3a6a046f4ee7688db0a5ea5c5e0a63e758b1c1e5711e7b227759e3
      CONTRACT_D_RELEASE: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
      CONTRACT_D_TAG: contract-d-v1.0.0
      CONTRACT_D_TAG_OBJECT: 6eadd688b482f3c9fce2ce5e7a2841089d852096
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Contract D authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_RELEASE }}
          path: .contract-d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact Contract D validator dependencies
        run: python -m pip install --disable-pip-version-check -e './.contract-d[dev]'

      - name: Verify exact subject and authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_RECORD_HEAD" HEAD
          test "$(sha256sum research/contract-c-adapter-projection-kernel/projectionKernel.mjs | cut -d' ' -f1)" = "$PROJECTION_KERNEL_SHA"
          test "$(git -C .contract-d rev-parse HEAD)" = "$CONTRACT_D_RELEASE"
          test "$(git -C .contract-d rev-parse "refs/tags/$CONTRACT_D_TAG")" = "$CONTRACT_D_TAG_OBJECT"
          test "$(git -C .contract-d rev-parse "$CONTRACT_D_TAG^{}")" = "$CONTRACT_D_RELEASE"

      - name: Execute policy implementation trust-boundary test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .policy-implementation-output
          mkdir -p .policy-implementation-output
          node research/policy-implementation-authority/run.mjs \
            --contract-d-root "$PWD/.contract-d" \
            --out "$PWD/.policy-implementation-output" | tee .policy-implementation-output/console.log

      - name: Verify research-only mutation surface
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_RECORD_HEAD"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src|scripts|tests)/'; then
            echo 'Policy implementation experiment modified maintained Decision paths' >&2
            exit 1
          fi

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          tar -czf policy-implementation-authority-evidence.tgz \
            .policy-implementation-output \
            research/policy-implementation-authority
          sha256sum policy-implementation-authority-evidence.tgz | tee .policy-implementation-output/evidence-tgz.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: policy-implementation-authority-${{ github.run_id }}
          path: |
            .policy-implementation-output/
            policy-implementation-authority-evidence.tgz
          if-no-files-found: error
          retention-days: 90
