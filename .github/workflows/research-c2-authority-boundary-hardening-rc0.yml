name: Research C2 authority-boundary hardening RC0

on:
  workflow_dispatch:
  push:
    branches:
      - research/c2-authority-boundary-hardening-rc0-20260917
  pull_request:
    branches:
      - integration/cal-pipeline-c2-ingress-20260915
    paths:
      - 'research/c2-authority-boundary-hardening-rc0/**'
      - '.github/workflows/research-c2-authority-boundary-hardening-rc0.yml'

permissions:
  contents: read

jobs:
  authority-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Decision Engine research head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify stacked Decision subject and research-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=b1bcc33e2b5ef0707b8cbf7dd8e821b2d34d1b55
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          if ! git diff --quiet "$BASE"..HEAD -- src scripts tests; then
            echo "Research branch changed maintained Decision source/scripts/tests" >&2
            git diff --name-status "$BASE"..HEAD -- src scripts tests >&2
            exit 1
          fi
          echo "Decision stacked base and maintained-byte scope verified"

      - name: Checkout exact Contract C2 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: _apparatus_c2
          fetch-depth: 1

      - name: Verify exact Contract C2 authority identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _apparatus_c2 rev-parse HEAD)" = "b42c827acb0a9fe65353354d709add0e27bab307"
          test "$(git -C _apparatus_c2 hash-object validators/contract_c_v2.py)" = "bb5a381f89828ddc92adfdedcc4e9d98069f436d"
          test "$(git -C _apparatus_c2 hash-object validators/contract_c_rc2.py)" = "1d2ecd228cde807138013c33c8675c3003421d3c"
          echo "Exact C2 authority verified"

      - name: Execute preregistered authority discriminator
        shell: bash
        env:
          APPARATUS_CONTRACT_C2_DIR: ${{ github.workspace }}/_apparatus_c2
          PYTHON: python3
          DECISION_C2_AUTHORITY_OUTPUT_DIR: build/c2-authority-boundary-hardening-rc0
        run: |
          set -o pipefail
          mkdir -p build/c2-authority-boundary-hardening-rc0
          node research/c2-authority-boundary-hardening-rc0/run.mjs \
            2>&1 | tee build/c2-authority-boundary-hardening-rc0/console.log

      - name: Upload research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-authority-boundary-hardening-rc0-${{ github.sha }}
          path: build/c2-authority-boundary-hardening-rc0/
          if-no-files-found: warn
