name: Research authority-adapter seam RC2

on:
  workflow_dispatch:
  push:
    branches:
      - research/authority-adapter-seam-rc2-20260917

permissions:
  contents: read

jobs:
  authority-adapter-seam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PARENT_HEAD: 97727a7d2f61c46b4e7ef3e11279fb0af7b915cd
      PROJECTION_KERNEL_SHA256: e12d53020b3a6a046f4ee7688db0a5ea5c5e0a63e758b1c1e5711e7b227759e3
      C2_AUTHORITY: b42c827acb0a9fe65353354d709add0e27bab307
      CAL_B_CONTROL: d03d0e960ad82d889e6763fd4fb53cd24babd187
      RESOLVER_AUTHORITY: 1d33e0612befcf8016816197c90c062373796df9
      CONTRACT_D_AUTHORITY: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
      CONTRACT_C_AUTHORITY: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
      LEGACY_MANIFEST_HEAD: 41c348fc7f1816df8827f9e37b9d90bd7a148624
      LEGACY_SPECIMEN: 33f39e88f0f94a13afe740d087e4896247695f79
    steps:
      - name: Checkout RC2 research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify preregistered subject and frozen kernel
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${PARENT_HEAD}^{commit}"
          git merge-base --is-ancestor "$PARENT_HEAD" HEAD
          if ! git diff --quiet "$PARENT_HEAD"..HEAD -- src scripts tests; then
            echo "RC2 changed maintained Decision source/scripts/tests" >&2
            git diff --name-status "$PARENT_HEAD"..HEAD -- src scripts tests >&2
            exit 1
          fi
          test "$(sha256sum research/authority-adapter-seam-rc2/projectionKernel.mjs | cut -d' ' -f1)" = "$PROJECTION_KERNEL_SHA256"

      - name: Checkout exact C2 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.C2_AUTHORITY }}
          path: _apparatus_c2
          fetch-depth: 1

      - name: Checkout independent Contract-B authority control
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: ${{ env.CAL_B_CONTROL }}
          path: _cal_authority
          fetch-depth: 1

      - name: Checkout independent CAL resolver authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.RESOLVER_AUTHORITY }}
          path: _resolver_authority
          fetch-depth: 1

      - name: Checkout exact Contract D authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_AUTHORITY }}
          path: _contract_d
          fetch-depth: 0

      - name: Checkout exact Contract C authority for legacy replay
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_C_AUTHORITY }}
          path: _contract_c
          fetch-depth: 0

      - name: Checkout frozen heterogeneous-authority research
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: ${{ env.LEGACY_MANIFEST_HEAD }}
          path: _legacy_manifest
          fetch-depth: 0

      - name: Checkout exact legacy specimen
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: ${{ env.LEGACY_SPECIMEN }}
          path: _legacy_specimen
          fetch-depth: 0

      - name: Install exact validator dependencies
        run: |
          python -m pip install --disable-pip-version-check -e './_contract_d[dev]'
          python -m pip install 'PyYAML>=6,<7'

      - name: Verify exact external identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _apparatus_c2 rev-parse HEAD)" = "$C2_AUTHORITY"
          test "$(git -C _cal_authority rev-parse HEAD)" = "$CAL_B_CONTROL"
          test "$(git -C _resolver_authority rev-parse HEAD)" = "$RESOLVER_AUTHORITY"
          test "$(git -C _contract_d rev-parse HEAD)" = "$CONTRACT_D_AUTHORITY"
          test "$(git -C _contract_c rev-parse HEAD)" = "$CONTRACT_C_AUTHORITY"
          test "$(git -C _legacy_manifest rev-parse HEAD)" = "$LEGACY_MANIFEST_HEAD"
          test "$(git -C _legacy_specimen rev-parse HEAD)" = "$LEGACY_SPECIMEN"
          test "$(sha256sum _legacy_manifest/research/contract-c-adapter-projection-kernel/projectionKernel.mjs | cut -d' ' -f1)" = "$PROJECTION_KERNEL_SHA256"

      - name: Re-run RC1 independent-authority discriminator
        shell: bash
        env:
          APPARATUS_CONTRACT_C2_DIR: ${{ github.workspace }}/_apparatus_c2
          CAL_CONTRACT_B_AUTHORITY_DIR: ${{ github.workspace }}/_cal_authority
          APPARATUS_RESOLVER_AUTHORITY_DIR: ${{ github.workspace }}/_resolver_authority
          PYTHON: python3
          DECISION_C2_ARTIFACT_AUTHORITY_OUTPUT_DIR: build/authority-adapter-seam-rc2/rc1
        run: |
          set -o pipefail
          mkdir -p build/authority-adapter-seam-rc2/rc1
          node research/c2-authority-artifact-reconstruction-rc1/run-successor.mjs 2>&1 | tee build/authority-adapter-seam-rc2/rc1/console.log

      - name: Re-run frozen Git-bound artifact-manifest authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/authority-adapter-seam-rc2/legacy
          node _legacy_manifest/research/artifact-manifest-authority-projection/run.mjs \
            --specimen-root "$PWD/_legacy_specimen" \
            --contract-c-root "$PWD/_contract_c" \
            --contract-d-root "$PWD/_contract_d" \
            --out "$PWD/build/authority-adapter-seam-rc2/legacy" \
            2>&1 | tee build/authority-adapter-seam-rc2/legacy/console.log
          test "$(jq -r .status build/authority-adapter-seam-rc2/legacy/RESULT.json)" = "PASS"
          test "$(jq -r .exact_projection_kernel_sha256 build/authority-adapter-seam-rc2/legacy/RESULT.json)" = "sha256:$PROJECTION_KERNEL_SHA256"

      - name: Execute CAL shadow, signed authority, and cross-adapter audit
        shell: bash
        env:
          APPARATUS_CONTRACT_C2_DIR: ${{ github.workspace }}/_apparatus_c2
          CAL_CONTRACT_B_AUTHORITY_DIR: ${{ github.workspace }}/_cal_authority
          APPARATUS_RESOLVER_AUTHORITY_DIR: ${{ github.workspace }}/_resolver_authority
          CONTRACT_D_AUTHORITY_DIR: ${{ github.workspace }}/_contract_d
          RC1_RESULT_PATH: ${{ github.workspace }}/build/authority-adapter-seam-rc2/rc1/RESULT.json
          LEGACY_MANIFEST_RESULT_PATH: ${{ github.workspace }}/build/authority-adapter-seam-rc2/legacy/RESULT.json
          AUTHORITY_ADAPTER_RC2_OUTPUT_DIR: build/authority-adapter-seam-rc2/current
          PYTHON: python3
        run: |
          set -o pipefail
          mkdir -p build/authority-adapter-seam-rc2/current
          node research/authority-adapter-seam-rc2/run-successor.mjs 2>&1 | tee build/authority-adapter-seam-rc2/current/console.log
          test "$(jq -r .disposition build/authority-adapter-seam-rc2/current/RESULT.json)" = "SUPPORTED_TRUSTED_AUTHORITY_ADAPTER_SEAM"

      - name: Recheck research-only scope
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$PARENT_HEAD"..HEAD -- src scripts tests; then
            git diff --name-status "$PARENT_HEAD"..HEAD -- src scripts tests >&2
            exit 1
          fi

      - name: Package evidence
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          tar -czf authority-adapter-seam-rc2-evidence.tgz build/authority-adapter-seam-rc2 research/authority-adapter-seam-rc2
          sha256sum authority-adapter-seam-rc2-evidence.tgz | tee build/authority-adapter-seam-rc2/evidence-tgz.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-adapter-seam-rc2-${{ github.sha }}
          path: |
            build/authority-adapter-seam-rc2/
            authority-adapter-seam-rc2-evidence.tgz
          if-no-files-found: error
          retention-days: 90
